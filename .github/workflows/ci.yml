name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  R2V: 6.2.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: radareorg/github-actions@v3
        with:
          version: ${{ env.R2V }}
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: |
          make BUNDLER=esbuild check
          python3 -m py_compile tests/*.py
      - name: Build
        run: make BUNDLER=esbuild
      - name: Unit tests
        run: make BUNDLER=esbuild test-unit
      - name: Upstream conformance suite (node)
        run: make BUNDLER=esbuild test-upstream
      - name: r2 golden tests
        run: make BUNDLER=esbuild test-r2
      - name: Upstream conformance suite (inside r2)
        run: make BUNDLER=esbuild test-upstream-r2
